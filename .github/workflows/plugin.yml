name: Plugin

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check and package
        run: ./gradlew check buildPlugin

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: kasm-intellij-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag version
        shell: bash
        run: |
          plugin_version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ -z "${plugin_version}" ]]; then
            echo "pluginVersion is missing in gradle.properties" >&2
            exit 1
          fi

          if [[ "${tag_version}" != "${plugin_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pluginVersion=${plugin_version}" >&2
            exit 1
          fi

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin -PintellijPlatformPublishingToken=${{ env.PUBLISH_TOKEN }} -PcertificateChain=${{CERTIFICATE_CHAIN}} -PprivateKey=${{PRIVATE_KEY}} -PprivateKeyPassword=${{PRIVATE_KEY_PASSWORD}}
